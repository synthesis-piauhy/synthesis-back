name: synthesis-mvp-acceptance

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synthesis_mvp_e2e
      POSTGRES_USER: synthesis_acceptance
      POSTGRES_PASSWORD: acceptance-only-password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthesis_acceptance -d synthesis_mvp_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
