# Replace synthesis.example.org and certificate paths before activation.
# Backend/Next listen on loopback only. Never publish MEDIA_ROOT directly.
limit_req_zone $binary_remote_addr zone=synthesis_auth:10m rate=30r/m;
server {
    listen 80;
    server_name synthesis.example.org;
    return 301 https://synthesis.example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name synthesis.example.org;
    ssl_certificate /etc/ssl/synthesis/fullchain.pem;
    ssl_certificate_key /etc/ssl/synthesis/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 20s;
    add_header Strict-Transport-Security "max-age=3600" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite the incoming value. The app trusts this single controlled proxy.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;

    location /media/ { return 404; }
    location /static/ { alias /srv/synthesis/backend/staticfiles/; }
    location /api/token/ {
        limit_req zone=synthesis_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ { proxy_pass http://127.0.0.1:8000; }
    location /admin/ {
        limit_req zone=synthesis_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
