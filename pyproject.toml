[project]
name = "synthesis-back"
version = "0.1.0"
description = "Backend da plataforma interna synthesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=2.3,<4",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "django-ninja-extra>=0.31,<0.32",
    "django-ninja-jwt>=5.3,<6",
    "django-storages[s3]>=1.14,<2",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001", "DJ012"]
